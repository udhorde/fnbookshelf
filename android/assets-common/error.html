<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连不上飞牛书屋</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f5f6f8; color: #1f2937;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .wrap { width: 100%; max-width: 460px; }
  .ico {
    width: 52px; height: 52px; border-radius: 16px; background: #fef2f2; color: #dc2626;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .addr { font-size: 13px; color: #6b7280; word-break: break-all; margin: 0 0 18px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .msg { font-size: 14px; color: #b91c1c; line-height: 1.7; word-break: break-word; margin: 0 0 14px; }
  ul { margin: 0; padding-left: 20px; font-size: 13px; color: #4b5563; line-height: 1.85; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1; padding: 13px 16px; font-size: 15px; font-family: inherit; font-weight: 600;
    border-radius: 10px; border: 1px solid #d1d5db; background: #fff; color: #374151; cursor: pointer;
  }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .code { font-size: 11px; color: #9ca3af; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ico">!</div>
  <h1>连不上服务器</h1>
  <p class="addr">地址：{{url}}</p>
  <div class="card">
    <p class="msg">{{msg}}</p>
    <ul>
      <li>确认 NAS 已开机，飞牛书屋应用在应用中心里是「运行中」</li>
      <li>确认手机 / 电视和 NAS 在同一个网络（或已连上 Tailscale 之类的内网）</li>
      <li>确认端口没写错，默认是 8096</li>
      <li>在电脑浏览器打开同一地址，能打开再回来重试</li>
    </ul>
    <div class="row">
      <button id="edit" type="button">修改地址</button>
      <button id="retry" class="primary" type="button">重试</button>
    </div>
    <div class="code">错误码 {{code}}</div>
  </div>
</div>
<script>
(function () {
  document.getElementById('retry').addEventListener('click', function () { FNB.reload(); });
  document.getElementById('edit').addEventListener('click', function () { FNB.openSettings(); });
})();
</script>
</body>
</html>
